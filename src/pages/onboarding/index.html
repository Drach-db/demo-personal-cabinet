<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - {{title}}</title>
    
    <!-- Layout System CSS -->
    <link rel="stylesheet" href="../../components/layout/layout.css">
    <link rel="stylesheet" href="../../components/navbar/navbar.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App Layout Grid Container -->
    <div class="app-layout" id="appLayout">
        
        <!-- Navbar Component -->
        <nav class="app-navbar" id="appNavbar">
            {{> navbar 
                activePage="onboarding" 
                userName="Anonymous User" 
                userRole="Guest Access"
            }}
        </nav>
        
        <!-- Header Component -->
        <header class="app-header" id="appHeader">
            {{> header 
                pageTitle='Onboarding <span class="accent-text">Management</span>'
                pageIcon='<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line>'
            }}
        </header>
        
        <!-- Main Content Area -->
        <main class="app-main" id="appMain">
            
            <!-- Loading Screen -->
            <div id="loadingScreen" class="loading-screen">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">Loading onboarding data...</p>
                </div>
            </div>

            <!-- Main Container -->
            <div id="mainContainer" class="content-wrapper" style="display: none;">
                
                <!-- Analytics Dashboard -->
<div class="stats-section">
    <div class="stats-grid">
        <!-- Active Employees -->
        <div class="stat-card">
            <div class="stat-content">
                <div class="stat-info">
                    <h3 class="stat-label">Active</h3>
                    <p class="stat-value" id="statActive">0</p>
                </div>
                <div class="stat-icon">
                    <svg class="icon icon-green" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path>
                        <path d="M4 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path>
                        <path d="M18 10l2 2l4 -4"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Onboarding -->
        <div class="stat-card">
            <div class="stat-content">
                <div class="stat-info">
                    <h3 class="stat-label">Onboarding</h3>
                    <p class="stat-value" id="statOnboarding">0</p>
                </div>
                <div class="stat-icon">
                    <svg class="icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Terminated -->
        <div class="stat-card">
            <div class="stat-content">
                <div class="stat-info">
                    <h3 class="stat-label">Terminated</h3>
                    <p class="stat-value" id="statTerminated">0</p>
                </div>
                <div class="stat-icon">
                    <svg class="icon icon-red" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path>
                        <path d="M4 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path>
                        <line x1="19" y1="11" x2="24" y2="11"></line>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Backup Pool -->
        <div class="stat-card">
            <div class="stat-content">
                <div class="stat-info">
                    <h3 class="stat-label">Backup</h3>
                    <p class="stat-value" id="statBackup">0</p>
                </div>
                <div class="stat-icon">
                    <svg class="icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>

                <!-- Batches List -->
                <div class="batches-section">
                    <div id="batchesList" class="batches-list">
                        <!-- Batch cards будут добавлены через JavaScript -->
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <line x1="19" y1="8" x2="19" y2="14"></line>
                            <line x1="22" y1="11" x2="16" y2="11"></line>
                        </svg>
                        <h3 class="empty-title">No onboarding batches</h3>
                        <p class="empty-text">New batches will appear here</p>
                    </div>
                </div>
                
            </div>
        </main>
        
        <!-- Mobile Overlay -->
        <div class="app-overlay" id="appOverlay"></div>
        
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
</body>
</html>
