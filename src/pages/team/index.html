<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading team data...</p>
        </div>
    </div>

    <!-- Main Container -->
    <div id="mainContainer" class="main-container" style="display: none;">
        <div class="container">
            
            <!-- Page Header -->
            <div class="page-header">
                <div class="header-card">
                    <h1 class="page-title">Team <span class="accent-text">Management</span></h1>
                </div>
            </div>
            
            <!-- Analytics Dashboard -->
            <div class="stats-grid">
                <!-- Active -->
                <div class="stat-card">
                    <div class="stat-content">
                        <div>
                            <h3 class="stat-label">Active</h3>
                            <p class="stat-value" id="statActive">0</p>
                        </div>
                        <div class="stat-icon">
                            <svg class="icon icon-green" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                <polyline points="9 11 12 14 22 4"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Onboarding -->
                <div class="stat-card">
                    <div class="stat-content">
                        <div>
                            <h3 class="stat-label">Onboarding</h3>
                            <p class="stat-value" id="statOnboarding">0</p>
                        </div>
                        <div class="stat-icon">
                            <svg class="icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Terminated -->
                <div class="stat-card">
                    <div class="stat-content">
                        <div>
                            <h3 class="stat-label">Terminated</h3>
                            <p class="stat-value" id="statTerminated">0</p>
                        </div>
                        <div class="stat-icon">
                            <svg class="icon icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                <line x1="18" y1="8" x2="23" y2="13"></line>
                                <line x1="23" y1="8" x2="18" y2="13"></line>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Backup -->
                <div class="stat-card">
                    <div class="stat-content">
                        <div>
                            <h3 class="stat-label">Backup</h3>
                            <p class="stat-value" id="statBackup">0</p>
                        </div>
                        <div class="stat-icon">
                            <svg class="icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search and Filters -->
            <div class="filters-container">
                <div class="filters-content">
                    <!-- Search Field -->
                    <div class="search-container">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input 
                            type="text" 
                            id="searchInput"
                            class="search-input"
                            placeholder="Search employees by name, position, or project..."
                        >
                        <button id="clearSearch" class="clear-search" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Filters -->
                    <div class="filters-group">
                        <!-- Project Filter -->
                        <div class="filter-dropdown">
                            <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="9" y1="9" x2="15" y2="9"></line>
                                <line x1="9" y1="15" x2="15" y2="15"></line>
                            </svg>
                            <button class="filter-button" id="projectFilterBtn">
                                <span id="projectFilterText">All Projects</span>
                            </button>
                            <button class="filter-clear" id="clearProjectFilter" style="display: none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 6L6 18M6 6l12 12"></path>
                                </svg>
                            </button>
                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                            <div class="dropdown-menu" id="projectDropdown" style="display: none;"></div>
                        </div>

                        <!-- Stage Filter -->
                        <div class="filter-dropdown">
                            <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <polyline points="10 11 13 14 23 4"></polyline>
                            </svg>
                            <button class="filter-button" id="stageFilterBtn">
                                <span id="stageFilterText">All Stages</span>
                            </button>
                            <button class="filter-clear" id="clearStageFilter" style="display: none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 6L6 18M6 6l12 12"></path>
                                </svg>
                            </button>
                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                            <div class="dropdown-menu" id="stageDropdown" style="display: none;"></div>
                        </div>

                        <!-- Position Filter -->
                        <div class="filter-dropdown">
                            <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="8" r="7"></circle>
                                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                            </svg>
                            <button class="filter-button" id="positionFilterBtn">
                                <span id="positionFilterText">All Positions</span>
                            </button>
                            <button class="filter-clear" id="clearPositionFilter" style="display: none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 6L6 18M6 6l12 12"></path>
                                </svg>
                            </button>
                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                            <div class="dropdown-menu" id="positionDropdown" style="display: none;"></div>
                        </div>
                    </div>

                    <!-- Results Count -->
                    <div class="results-count">
                        <span id="resultsCount">0 of 0</span>
                    </div>
                </div>
            </div>

            <!-- Team Members Grid -->
            <div class="team-grid" id="teamGrid">
                <!-- Employee cards will be inserted here by JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <h3 class="empty-title">No team members found</h3>
                <p class="empty-text">Try adjusting your search criteria or filters</p>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
