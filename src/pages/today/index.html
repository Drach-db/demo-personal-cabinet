<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html,body{background:#f0eee7}
        html.no-anim *{transition:none !important}
    </style>
    <script>
        try {
            var s = localStorage.getItem('navbar-state');
            if (s && JSON.parse(s).collapsed) {
                document.documentElement.classList.add('navbar-pre-collapsed');
            }
            document.documentElement.classList.add('no-anim');
        } catch (e) {}
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Today - Monitoring</title>

    <!-- Layout System CSS (ПЕРВЫМ!) -->
    <link rel="stylesheet" href="../../components/layout/layout.css">

    <!-- Component CSS -->
    <link rel="stylesheet" href="../../components/navbar/navbar.css?v=nav-20250915">
    <link rel="stylesheet" href="../../components/header/header.css">

    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout" id="appLayout">
        <!-- Navbar Component -->
        <nav class="app-navbar" id="appNavbar">
            {{> navbar
                activePage="today"
                userName="Anonymous User"
                userRole="Guest Access"
            }}
        </nav>

        <!-- Header Component -->
        <header class="app-header" id="appHeader">
            {{> header
                pageTitle='Today <span class="accent-text">Monitoring</span>'
                pageIcon='<rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>'
            }}
        </header>

        <!-- Main Content Area -->
        <main class="app-main" id="appMain">
            <div class="content-container">
                <div id="app"></div>
                <div id="modal-root"></div>
            </div>
        </main>

        <!-- Mobile Overlay -->
        <div class="app-overlay" id="appOverlay"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
    <script>
        window.addEventListener('load',function(){
            document.documentElement.classList.remove('no-anim');
        });
    </script>
</body>
</html>
