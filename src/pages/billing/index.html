<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        html,body{background:#f0eee7}
        html.no-anim *{transition:none !important}
    </style>
    <script>
        try {
            var s = localStorage.getItem('navbar-state');
            if (s && JSON.parse(s).collapsed) {
                document.documentElement.classList.add('navbar-pre-collapsed');
            }
            document.documentElement.classList.add('no-anim');
        } catch (e) {}
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Billing Management - Dashboard</title>

    <!-- Layout System CSS (ПЕРВЫМ!) -->
    <link rel="stylesheet" href="../../components/layout/layout.css">

    <!-- Component CSS -->
    <link rel="stylesheet" href="../../components/navbar/navbar.css">
    <link rel="stylesheet" href="../../components/header/header.css">

    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App Layout Grid Container -->
    <div class="app-layout" id="appLayout">

        <!-- Navbar Component -->
        <nav class="app-navbar" id="appNavbar">
            {{> navbar
                activePage="billing"
                userName="Anonymous User"
                userRole="Guest Access"
            }}
        </nav>

        <!-- Header Component -->
        <header class="app-header" id="appHeader">
            {{> header
                pageTitle='Billing <span class="accent-text">Management</span>'
                pageIcon='<line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>'
            }}
        </header>

        <!-- Main Content Area -->
        <main class="app-main" id="appMain">
            <div class="content-container">
                <div id="billingLoadingContainer" class="loading-container hidden">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">Loading Billing...</p>
                </div>
                <!-- Dashboard Section -->
                <div class="billing-card">
                    <div id="dashboardSection">
                        <!-- Будет заполнено через JS -->
                    </div>
                </div>

                <!-- Billing History Table -->
                <div class="billing-card">
                    <div id="historySection">
                        <!-- Будет заполнено через JS -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Mobile Overlay -->
        <div class="app-overlay" id="appOverlay"></div>
    </div>

    <!-- Scripts с type="module" -->
    <script type="module" src="script.js"></script>
    <script>
        window.addEventListener('load',function(){
            document.documentElement.classList.remove('no-anim');
        });
    </script>
</body>
</html>
