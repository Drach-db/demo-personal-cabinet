<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=/pages/schedules/" />
  <title>Redirecting…</title>
  <script>
    // JS fallback for environments that ignore meta refresh
    try {
      if (location && location.pathname === '/') {
        location.replace('/pages/schedules/');
      }
    } catch (e) {}
  </script>
  <style>body{font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;padding:2rem;color:#374151}</style>
</head>
<body>
  <p>Redirecting to calendar… If you are not redirected, <a href="/pages/schedules/">click here</a>.</p>
</body>
</html>
