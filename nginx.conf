server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Default: redirect root to Team page
    location = / {
        return 302 /pages/team/;
    }

    # Serve any page at /pages/<name>/ as its index.html
    location ~ ^/pages/([a-zA-Z0-9_-]+)/?$ {
        try_files /pages/$1/index.html =404;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;
    }
}
